spring.application.name=expedientes-backend

# ───────── Conexion a SQL Server ─────────
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=GestionExpedientes;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ───────── Almacenamiento local de archivos ─────────
app.storage.base-path=C:/expedientes/archivos
app.storage.max-file-size-mb=10

# ───────── OCR / IA (extracción de datos y resumen del PDF adjunto) ─────────
# Para habilitar el resumen por IA: pon app.ia.habilitado=true y coloca tu API key
# de Anthropic (https://console.anthropic.com/) en app.ia.api-key (o variable de entorno ANTHROPIC_API_KEY).
# Si está deshabilitado o falla la llamada, se guarda un resumen de respaldo armado con los datos extraídos.
app.ia.habilitado=false
app.ia.api-key=${ANTHROPIC_API_KEY:}
app.ia.modelo=claude-haiku-4-5
app.ia.max-tokens=400

# ───────── JWT ─────────
app.jwt.secret=CAMBIA_ESTE_SECRETO_POR_UNO_LARGO_Y_ALEATORIO_DE_AL_MENOS_64_CARACTERES
app.jwt.expiration-minutes=480

# ───────── Subida de archivos (limites del servidor web) ─────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=8080

# ───────── CORS (frontend Angular en desarrollo) ─────────
app.cors.allowed-origins=http://localhost:4200
